env:
  - CFLAGS: -O3 -std=c11 -Wall -Wextra -pedantic
    MATRIX_SEED: '20260730'
space:
  size:
    - name: 512x512
      value: 512
    - name: 1024x1024
      value: 1024
    - name: 1536x1536
      value: 1536
  variant: [dot, rows, columns]
  tile:
    - name: none
      value: 0
    - name: 32x32
      value: 32
    - name: 64x64
      value: 64
    - name: 128x128
      value: 128
    - name: 256x256
      value: 256
setup:
  global:
    - mkdir -p build data
    - cc $CFLAGS matmul.c -o build/matmul
  point:
    - command:
        - python3 generate.py
        - --size ${yuclid.size}
        - --seed $MATRIX_SEED
        - --output data/n${yuclid.size}.bin
      'on': [size]
      parallel: true
trials:
  - ./build/matmul ${yuclid.variant} data/n${yuclid.size}.bin ${yuclid.tile}
metrics:
  - name: seconds
    command: awk '{print $1}' ${yuclid.@}.out
  - name: peak_rss_kib
    command: awk '{print $3}' ${yuclid.@}.out
presets:
  quick:
    size: [512x512]
  large:
    size: [1024x1024, 1536x1536]
order: [size, variant, tile]
