<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yuclid</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfbfa; --panel: #fff; --line: #e3e1dd; --ink: #1c1b19;
    --dim: #6b6862; --accent: #2f6f4e; --warn: #a4462d; --chip: #f1efec;
    --pause: #b8891b; --fail: #7d4bb0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a; --panel: #1d1e22; --line: #2e3036; --ink: #e6e4e1;
      --dim: #918d87; --accent: #6fb58c; --warn: #e08a6d; --chip: #26282d;
      --pause: #d8b155; --fail: #b18ad8;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 12px;
  }
  header b { font-weight: 600; letter-spacing: .02em; }
  main { display: grid; grid-template-columns: 260px minmax(0, 1fr); }
  @media (max-width: 720px) { main { grid-template-columns: 1fr; } }
  #runs {
    border-right: 1px solid var(--line); min-height: 70vh;
    display: flex; flex-direction: column;
  }
  /* the list scrolls between them, so both stay where they were put */
  #runs .list { overflow-y: auto; }
  #runs button.manage {
    border-top: 1px solid var(--line); border-bottom: 0; text-align: center;
  }

  /* Above the narrow breakpoint the two panels each fill the window and
     scroll on their own, so the foot of the run panel is the foot of the
     window rather than the foot of whichever run is being displayed. */
  @media (min-width: 721px) {
    body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    main { flex: 1; min-height: 0; }
    #runs { min-height: 0; }
    #runs .list { flex: 1; }
    #panes { overflow-y: auto; min-height: 0; }
  }
  #runs button {
    display: block; width: 100%; text-align: left; padding: 10px 16px;
    background: none; border: 0; border-bottom: 1px solid var(--line);
    color: inherit; font: inherit; cursor: pointer;
  }
  #runs button:hover { background: var(--chip); }
  #runs button[aria-current="true"] { background: var(--chip); font-weight: 600; }
  #runs small { display: block; font-weight: 400; }
  #runs small .dimmed { color: var(--dim); }
  #runs small .state { color: var(--dim); font-weight: 600; }
  #runs small .state.running { color: var(--accent); }
  #runs small .state.pausing { color: var(--pause); }
  section { padding: 18px 20px; border-bottom: 1px solid var(--line); }
  h2 {
    margin: 0 0 10px; font-size: 12px; text-transform: uppercase;
    letter-spacing: .08em; color: var(--dim); font-weight: 600;
  }
  .bar { height: 8px; background: var(--chip); border-radius: 4px; overflow: hidden; }
  .bar div { height: 100%; background: var(--accent); width: 0; transition: width .3s, background .3s; }
  .bar[data-mood="paused"] div { background: var(--pause); }
  .bar[data-mood="failed"] div { background: var(--fail); }
  .bar[data-mood="dead"] div { background: var(--warn); }
  .state { font-weight: 600; }
  .state[data-mood="fine"] { color: var(--accent); }
  .state[data-mood="paused"] { color: var(--pause); }
  .state[data-mood="failed"] { color: var(--fail); }
  .state[data-mood="dead"] { color: var(--warn); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button.act {
    padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--panel); color: inherit; font: inherit; cursor: pointer;
  }
  button.act:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button.act:disabled { opacity: .4; cursor: not-allowed; }
  button.act.danger:hover:not(:disabled) { border-color: var(--warn); color: var(--warn); }
  #name {
    padding: 4px 8px; border: 1px solid transparent; border-radius: 6px;
    background: none; color: inherit; font: inherit; font-weight: 600; width: 22ch;
  }
  #name:hover { border-color: var(--line); }
  #name:focus { border-color: var(--accent); outline: none; background: var(--panel); }
  .dim-row { margin-bottom: 10px; }
  .dim-row > b {
    display: block; color: var(--dim); font-weight: 600; font-size: 12.5px;
  }
  .zone {
    display: flex; flex-wrap: wrap; align-items: center; gap: 4px;
    min-height: 30px; padding: 2px 4px; border: 1px dashed transparent;
    border-radius: 8px;
  }
  .zone[data-over="true"] { border-color: var(--accent); background: var(--chip); }
  .zone .hint { color: var(--dim); font-size: 12.5px; }
  .chip {
    padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--chip); color: inherit; font: inherit; font-size: 13px;
    cursor: pointer;
  }
  .chip:hover:not(:disabled) { border-color: var(--warn); color: var(--warn); }
  .chip:disabled { cursor: default; opacity: .6; }
  .chip.gone {
    opacity: .55; text-decoration: line-through; cursor: grab;
  }
  .chip.gone:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  /* the same height as the buttons below the selection, so the two rows of
     controls read as the same kind of thing */
  .preset {
    display: inline-flex; align-items: center; font: inherit;
    border: 1px solid var(--line); border-radius: 6px; background: var(--panel);
  }
  .preset .label { padding: 0 4px; }
  .preset button {
    border: 0; background: none; color: var(--dim); font: inherit;
    cursor: pointer; padding: 6px 12px; border-radius: 6px;
  }
  .preset button.plus:hover { color: var(--accent); font-weight: 600; }
  .preset button.minus:hover { color: var(--warn); font-weight: 600; }
  /* A question is not bad news. Red is kept for the questions that end with
     something being deleted, so that the colour still means something when it
     does appear. */
  .confirm {
    display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px;
    padding: 2px 4px 2px 10px; border: 1px solid var(--accent);
    border-radius: 999px; font-size: 13px;
  }
  .confirm button {
    border: 0; background: none; color: inherit; font: inherit; font-size: 13px;
    cursor: pointer; padding: 1px 6px; border-radius: 999px;
  }
  .confirm .yes { color: var(--accent); font-weight: 600; }
  .confirm .no { color: var(--dim); }
  .confirm.danger { border-color: var(--warn); }
  .confirm.danger .yes { color: var(--warn); }
  pre {
    margin: 0; max-height: 40vh; overflow: auto; font-size: 12.5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--dim);
  }
  #says { color: var(--dim); min-height: 1.5em; }
  #says[data-bad="true"] { color: var(--warn); }
  #launch label { color: var(--dim); }
  #launch input {
    padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--panel); color: inherit; font: inherit;
  }
  #runs button.new {
    color: var(--accent); font-weight: 600;
  }
  #launch-repeat { width: 6ch; }
  /* the selection is one thing, and the buttons that act on it are not part
     of it: the rules say where it begins and ends */
  .selection {
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    padding: 12px 0 2px; margin: 12px 0;
  }
  .free { display: block; width: 100%; max-width: 40ch; }
  #rfile {
    margin-bottom: 4px; font-size: 12.5px; color: var(--dim); cursor: pointer;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    overflow-wrap: anywhere;
  }
  #rfile:hover { color: var(--accent); }
  #rcommand {
    margin-top: 6px; font-size: 12.5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  #rcommand .what { color: var(--ink); overflow-wrap: anywhere; }
  #rcommand .what.short {
    display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #rcommand button {
    margin-left: 6px; border: 0; background: none; color: var(--dim);
    font: inherit; cursor: pointer; text-decoration: underline;
  }
  #rcommand button:hover { color: var(--accent); }
  #rsetup {
    margin-top: 6px; font-size: 12.5px; color: var(--warn);
    overflow-wrap: anywhere;
  }
  header #version { margin-left: auto; color: var(--dim); font-size: 12.5px; }
</style>
</head>
<body>
<header><b>yuclid</b><span id="version">__YUCLID_VERSION__</span></header>
<main>
  <nav id="runs"></nav>
  <div id="panes">
    <section id="launch" hidden>
      <h2>New run — choose the subspace to cover</h2>
      <div id="launch-body"></div>
      <div class="row" style="margin-top: 12px">
        <label>repeat <input id="launch-repeat" type="number" min="1" value="1"></label>
        <label>name <input id="launch-name" placeholder="optional"></label>
        <button class="act" id="launch-go">Start</button>
        <span id="launch-size" style="color: var(--dim)"></span>
      </div>
      <p id="launch-says" style="color: var(--dim); min-height: 1.5em"></p>
    </section>
    <section id="manage" hidden>
      <h2>Manage runs</h2>
      <div id="manage-body"></div>
    </section>
    <div id="detail">
    <section>
      <h2>Run</h2>
      <div class="row">
        <input id="name" aria-label="run name">
        <code id="rid" style="color: var(--dim)">—</code>
        <span class="state" id="rstate"></span>
        <span id="rcount" style="color: var(--dim)"></span>
      </div>
      <div class="bar" id="rbar" style="margin: 10px 0"><div></div></div>
      <div id="rfile" title="click to copy"></div>
      <div style="color: var(--dim)" id="rwhen"></div>
      <div style="color: var(--dim)" id="rwhere"></div>
      <div id="rcommand"></div>
      <div id="rsetup"></div>
    </section>
    <section>
      <h2>Control</h2>
      <div class="row">
        <button class="act" data-op="pause">Pause</button>
        <button class="act" data-op="resume">Resume</button>
        <button class="act" data-op="stop">Stop</button>
        <button class="act" data-op="kill" data-scope="rep">Kill repetition</button>
        <button class="act" data-op="kill" data-scope="point">Kill point</button>
        <span id="rdelete"></span>
      </div>
      <p id="says"></p>
    </section>
    <section>
      <h2>Dimensions — click to drop, drag back to restore</h2>
      <div id="dims"></div>
    </section>
    <section id="gaps-section" hidden>
      <h2>Gaps — points of the space with no measurement</h2>
      <div id="gaps"></div>
      <div class="row" style="margin-top: 10px" id="gaps-actions"></div>
      <p id="gaps-how" style="color: var(--dim)"></p>
    </section>
    <section>
      <h2>Log</h2>
      <pre id="log"></pre>
    </section>
    </div>
  </div>
</main>
<script>
const TOKEN = "__YUCLID_TOKEN__";
let current = null, since = 0, live = false, lines = [], asking = null, editing = false;

const ask = async (path, body, method) => {
  const options = {headers: {Authorization: "Bearer " + TOKEN}};
  if (body !== undefined) {
    options.method = method || "POST";
    options.body = JSON.stringify(body);
  }
  const response = await fetch(path, options);
  return response.json();
};

const say = (text, bad) => {
  const says = document.getElementById("says");
  says.textContent = text || "";
  says.dataset.bad = bad ? "true" : "false";
};

const describe = (op, effect) => {
  const left = (effect.total || 0) - (effect.completed || 0);
  if (op.op === "drop") return `${effect.dropped} point(s) dropped, ${left} unit(s) remain`;
  if (op.op === "add")
    return `${effect.added} point(s) added, ${effect.restored} restored, ${left} unit(s) remain`;
  if (op.op === "kill") return `abandoned ${(effect.points || []).map(p => p.join(".")).join(", ")}`;
  if (op.op === "pause")
    return effect.in_flight
      ? `pausing: no new point will start, and the ${effect.in_flight} in flight ` +
        "will finish their repetitions first"
      : "paused: nothing was running";
  if (op.op === "resume") return `resumed, ${left} unit(s) remain`;
  if (op.op === "stop") return `stopping, ${effect.abandoned} point(s) abandoned`;
  return JSON.stringify(effect);
};

const send = async op => {
  say("…");
  const answer = await ask(`/api/runs/${current}/control`, op);
  if (answer.error) return say(answer.error, true);
  say(describe(op, answer.effect));
  awaiting = op.op === "pause" && answer.effect.in_flight ? "pause" : null;
  refresh();
};

document.querySelectorAll("button.act[data-op]").forEach(button => {
  button.onclick = () => {
    const op = {op: button.dataset.op};
    if (button.dataset.scope) op.scope = button.dataset.scope;
    send(op);
  };
});

// -- the name -------------------------------------------------------------

const name = document.getElementById("name");

// a run already answers to its timestamp, so that is what an unnamed one shows
// and what typing starts from: naming one is usually adding to it rather than
// replacing it
name.onfocus = () => {
  editing = true;
  if (name.value === "") {
    name.value = current;
    requestAnimationFrame(() => name.setSelectionRange(current.length, current.length));
  }
};
name.onblur = async () => {
  editing = false;
  // left exactly as it was handed over: that is not a name, it is the default
  const given = name.value === current ? "" : name.value;
  const answer = await ask(`/api/runs/${current}/name`, {name: given}, "PUT");
  if (answer.error) say(answer.error, true);
  refresh();
};
name.onkeydown = e => {
  if (e.key === "Enter") name.blur();
  if (e.key === "Escape") { name.value = name.dataset.saved || ""; name.blur(); }
};

// -- dropping, with one question first ------------------------------------

const cancel = () => {
  if (asking) {
    asking = null;
    renderDims(lastRun);
  }
};
document.addEventListener("keydown", e => e.key === "Escape" && cancel());
document.addEventListener("click", e => {
  if (asking && !e.target.closest(".confirm") && !e.target.closest(".chip")) cancel();
});

// Dropping one value and dropping the dimension it belongs to are both
// reasonable things to mean by clicking it, and they differ by a lot — every
// point carries a value in every dimension, so the second empties the run.
// The question names both, with what each would cost.
const confirmChip = (dim, value) => {
  const values = (lastRun.dimensions || {})[dim] || [];
  const here = values.find(v => v.value === value);
  const one = here ? here.pending : 0;
  const all = values.reduce((total, v) => total + v.pending, 0);

  const box = document.createElement("span");
  box.className = "confirm";
  box.append(`drop ${dim}=${value}?`);

  const choose = (label, coords) => {
    const button = document.createElement("button");
    button.className = "yes";
    button.textContent = label;
    button.onclick = () => {
      asking = null;
      send({op: "drop", coords});
    };
    return button;
  };

  const no = document.createElement("button");
  no.className = "no";
  no.textContent = "cancel";
  no.onclick = cancel;

  box.append(
    choose(`just this value (${one} point${one === 1 ? "" : "s"})`, {[dim]: [value]}),
    choose(
      `the whole ${dim} dimension (${all} point${all === 1 ? "" : "s"})`,
      {[dim]: values.map(v => v.value)}
    ),
    no
  );
  return box;
};

// -- building a run out of the space --------------------------------------

// what the configuration declares, and which of it the next run should cover.
// The gestures are the ones the Dimensions panel already uses, so a value is
// taken out of a run the same way it is dropped from one
let config = null;
const chosen = {};
const typed = {};
const describePreset = name => {
  const parts = Object.entries(config.presets[name]).map(
    ([dim, values]) => `${dim}=${values.join(",")}`
  );
  return parts.length ? parts.join("  ") : "names nothing";
};

const listed = dim => (typed[dim] || "").split(",").map(v => v.trim()).filter(Boolean);

// A preset names values, and the two signs put them into the selection or take
// them out of it. Nothing is remembered about which preset was pressed: the
// selection below is the whole of the state, and a preset is only a quick way
// of reaching for the values it happens to name.
const applyPreset = (name, adding) => {
  let changed = 0;
  for (const [dim, values] of Object.entries(config.presets[name])) {
    if (config.dimensions[dim]) {
      for (const value of values) {
        const had = chosen[dim].has(value);
        adding ? chosen[dim].add(value) : chosen[dim].delete(value);
        if (had !== chosen[dim].has(value)) changed += 1;
      }
    } else {
      // a dimension the space leaves open: the same, over what was typed
      const set = new Set(listed(dim));
      for (const value of values) {
        const had = set.has(value);
        adding ? set.add(value) : set.delete(value);
        if (had !== set.has(value)) changed += 1;
      }
      typed[dim] = [...set].join(", ");
    }
  }
  renderLaunch();
  tell(
    changed
      ? `${name}: ${changed} value(s) ${adding ? "added to" : "taken out of"} the selection`
      : `${name}: nothing to ${adding ? "add" : "take out"}, the selection already says so`
  );
};

// the pane shows one subject at a time: a run, the run being composed, or the
// things that belong to no run in particular
let pane = "detail";

const show = which => {
  pane = which;
  for (const name of ["launch", "detail", "manage"]) {
    document.getElementById(name).hidden = name !== which;
  }
  if (which === "launch" && !config) loadConfig();
  if (which === "manage") renderManage();
  renderNav(lastRuns);
};

// a point spelled out: `1024.columns.32x32` says which values but not which
// dimensions, and the dimensions are the half worth reading
const coords = (order, key) =>
  order && order.length === key.length
    ? order.map((dim, i) => `${dim}=${key[i]}`).join(", ")
    : key.join(".");

const size = bytes => {
  if (bytes < 1024) return `${bytes} B`;
  const units = ["kB", "MB", "GB", "TB"];
  let value = bytes / 1024;
  let unit = 0;
  while (value >= 1024 && unit < units.length - 1) {
    value /= 1024;
    unit += 1;
  }
  return `${value < 10 ? value.toFixed(1) : Math.round(value)} ${units[unit]}`;
};

const renderManage = async () => {
  const body = document.getElementById("manage-body");
  body.innerHTML = "";

  const block = document.createElement("div");
  const count = lastRuns.length;
  const going = lastRuns.filter(r => r.state === "running").length;

  const what = document.createElement("p");
  what.style.color = "var(--dim)";
  what.textContent =
    `${count} run(s) are recorded under .yuclid/runs. Deleting them removes ` +
    "each run's directory: the log of everything it printed, the plan and " +
    "progress it recorded, the trial output under tmp/, and its copy of the " +
    "results.";
  block.append(what);

  // the part that would otherwise be alarming: what is not going
  const kept = document.createElement("p");
  kept.style.color = "var(--dim)";
  kept.textContent =
    "The .jsonl results in the working directory stay.";
  block.append(kept);

  const room = document.createElement("p");
  room.style.color = "var(--dim)";
  block.append(room);
  ask("/api/usage").then(usage => {
    room.textContent = `That would free about ${size(usage.bytes)}.`;
  });

  const button = document.createElement("button");
  button.className = "act danger";
  button.textContent = `Delete all ${count} run(s)`;
  button.disabled = count === 0;
  button.onclick = () => {
    // asked here, as part of this page, rather than on the button that led to it
    block.innerHTML = "";
    const question = document.createElement("p");
    question.innerHTML = `<b>Delete the record of all ${count} run(s)?</b>`;
    const detail = document.createElement("p");
    detail.style.color = "var(--dim)";
    detail.textContent = going
      ? `${going} still going will be left alone. This cannot be undone.`
      : "This cannot be undone.";
    const row = document.createElement("div");
    row.className = "row";
    const yes = document.createElement("button");
    yes.className = "act danger";
    yes.style.color = "var(--warn)";
    yes.textContent = "Delete them";
    yes.onclick = async () => {
      row.querySelectorAll("button").forEach(b => (b.disabled = true));
      const answer = await ask("/api/runs", {}, "DELETE");
      if (answer.error) {
        detail.textContent = answer.error;
        return;
      }
      current = null;
      await refresh();
      renderManage();
      const said = document.createElement("p");
      said.style.color = "var(--dim)";
      said.textContent =
        `${answer.deleted.length} deleted` +
        (answer.kept.length ? `, ${answer.kept.length} still going and kept` : "");
      document.getElementById("manage-body").append(said);
    };
    const no = document.createElement("button");
    no.className = "act";
    no.textContent = "Cancel";
    no.onclick = renderManage;
    row.append(yes, no);
    block.append(question, detail, row);
  };

  block.append(button);
  body.append(block);
};

const loadConfig = async () => {
  config = await ask("/api/config");
  if (config.error) {
    document.getElementById("launch-body").textContent = config.error;
    return;
  }
  for (const [dim, values] of Object.entries(config.dimensions)) {
    if (values) chosen[dim] = new Set(values);
  }
  renderLaunch();
};

const renderLaunch = () => {
  const body = document.getElementById("launch-body");
  body.innerHTML = "";

  const names = Object.keys(config.presets || {});
  if (names.length) {
    const row = document.createElement("div");
    row.className = "dim-row";
    const label = document.createElement("b");
    label.textContent = "presets — put their values into the selection, or take them out";
    row.append(label);
    const zone = document.createElement("div");
    zone.className = "zone";
    for (const preset of names) {
      const pill = document.createElement("span");
      pill.className = "preset";
      pill.title = describePreset(preset);

      const plus = document.createElement("button");
      plus.className = "plus";
      plus.textContent = "+";
      plus.title = `add the values of ${preset}`;
      plus.onclick = () => applyPreset(preset, true);

      const named = document.createElement("span");
      named.className = "label";
      named.textContent = preset;

      const minus = document.createElement("button");
      minus.className = "minus";
      minus.textContent = "−";
      minus.title = `take the values of ${preset} out`;
      minus.onclick = () => applyPreset(preset, false);

      pill.append(plus, named, minus);
      zone.append(pill);
    }
    row.append(zone);
    body.append(row);
  }

  // the selection proper, ruled off from what acts on it
  const fields = document.createElement("div");
  fields.className = "selection";
  body.append(fields);

  for (const [dim, values] of Object.entries(config.dimensions)) {
    const row = document.createElement("div");
    row.className = "dim-row";
    const label = document.createElement("b");
    label.textContent = values === null ? `${dim} — needs values` : dim;
    row.append(label);

    if (values === null) {
      // a dimension the configuration leaves open: a run has to supply it
      const field = document.createElement("input");
      field.className = "free";
      field.placeholder = "value1, value2";
      field.value = typed[dim] || "";
      field.oninput = () => {
        typed[dim] = field.value;
        showSize();
      };
      row.append(field);
      fields.append(row);
      continue;
    }

    // two zones, as in the Dimensions panel: a value is clicked across or
    // dragged across, and where it sits is what the run will cover
    const kept = document.createElement("div");
    kept.className = "zone";
    const left = document.createElement("div");
    left.className = "zone";
    const hint = document.createElement("span");
    hint.className = "hint";
    hint.textContent = "left out:";

    const move = (value, into) => {
      into ? chosen[dim].add(value) : chosen[dim].delete(value);
      renderLaunch();
    };
    for (const value of values) {
      const inside = chosen[dim].has(value);
      const chip = document.createElement("button");
      chip.className = inside ? "chip" : "chip gone";
      chip.textContent = value;
      chip.draggable = true;
      chip.title = inside ? `leave ${value} out` : `put ${value} back`;
      chip.onclick = () => move(value, !inside);
      chip.ondragstart = e => e.dataTransfer.setData("text/plain", value);
      (inside ? kept : left).append(chip);
    }
    for (const [zone, into] of [[kept, true], [left, false]]) {
      zone.ondragover = e => {
        e.preventDefault();
        zone.dataset.over = "true";
      };
      zone.ondragleave = () => (zone.dataset.over = "false");
      zone.ondrop = e => {
        e.preventDefault();
        zone.dataset.over = "false";
        const value = e.dataTransfer.getData("text/plain");
        if (values.includes(value)) move(value, into);
      };
    }
    row.append(kept);
    // the second zone only appears once something is in it, so a dimension
    // that is wholly in the run stays one line
    if (left.children.length) {
      left.prepend(hint);
      row.append(left);
    }
    fields.append(row);
  }

  // below the selection, because they act on what is above them
  const bulk = document.createElement("div");
  bulk.className = "row";
  for (const [label, full] of [["Full space", true], ["Empty space", false]]) {
    const button = document.createElement("button");
    button.className = full ? "act" : "act danger";
    button.textContent = label;
    button.title = full
      ? "put every value of every dimension into the selection"
      : "take every value out, to build the space up from nothing";
    button.onclick = () => {
      const open = [];
      for (const [dim, values] of Object.entries(config.dimensions)) {
        if (values) {
          chosen[dim] = new Set(full ? values : []);
        } else if (!full) {
          typed[dim] = "";
        } else if (!listed(dim).length) {
          // nothing to take: the space names no values for this one
          open.push(dim);
        }
      }
      renderLaunch();
      if (full) {
        tell(
          open.length
            ? `the whole space, except ${open.join(", ")}: the configuration ` +
              "names no values for those, so a run has to be given some"
            : "every value is in the selection"
        );
      } else {
        tell("the space is empty: add values with a preset, or click them back in");
      }
    };
    bulk.append(button);
  }
  body.append(bulk);

  showSize();
};

const selection = () => {
  const select = {};
  for (const [dim, values] of Object.entries(config.dimensions)) {
    if (values === null) {
      const list = (typed[dim] || "").split(",").map(v => v.trim()).filter(Boolean);
      select[dim] = list;
    } else if (chosen[dim].size !== values.length) {
      // only what was narrowed: sending the whole space back would just be
      // the configuration, spelled out again
      select[dim] = [...chosen[dim]];
    }
  }
  return select;
};

const showSize = () => {
  let points = 1;
  const empty = [];
  for (const [dim, values] of Object.entries(config.dimensions)) {
    const n =
      values === null
        ? (typed[dim] || "").split(",").filter(v => v.trim()).length
        : chosen[dim].size;
    if (n === 0) empty.push(dim);
    points *= n;
  }
  const size = document.getElementById("launch-size");
  const go = document.getElementById("launch-go");
  go.disabled = empty.length > 0;
  // conditions may still carve some of these away, so this is a ceiling
  size.textContent = empty.length
    ? `nothing chosen for ${empty.join(", ")}`
    : `up to ${points} point(s)`;
};

const tell = (text, bad) => {
  const says = document.getElementById("launch-says");
  says.textContent = text || "";
  says.style.color = bad ? "var(--warn)" : "var(--dim)";
};

document.getElementById("launch-go").onclick = async () => {
  const go = document.getElementById("launch-go");
  go.disabled = true;
  tell("starting…");
  const answer = await ask("/api/runs", {
    select: selection(),
    repeat: Number(document.getElementById("launch-repeat").value) || 1,
    name: document.getElementById("launch-name").value,
  });
  go.disabled = false;
  if (answer.error) return tell(answer.error, true);
  tell(`run ${answer.started} started`);
  select(answer.started);
  refresh();
};

// -- the dimensions -------------------------------------------------------

let lastRun = null, choosing = false;
// an operation whose message is a promise about what is going to happen
let awaiting = null;

let dimsShow = "";

const renderDims = run => {
  const dims = document.getElementById("dims");

  // the chips would otherwise be replaced under the pointer every second,
  // losing the hover and any question being asked on one of them
  const signature = JSON.stringify([run.id, run.dimensions, live, asking]);
  if (signature === dimsShow) return;
  dimsShow = signature;

  dims.innerHTML = "";
  for (const [dim, values] of Object.entries(run.dimensions || {})) {
    const kept = values.filter(v => !v.dropped);
    const gone = values.filter(v => v.dropped);

    const row = document.createElement("div");
    row.className = "dim-row";
    const label = document.createElement("b");
    label.textContent = dim;
    row.append(label);

    const zone = document.createElement("div");
    zone.className = "zone";
    zone.ondragover = e => {
      e.preventDefault();
      zone.dataset.over = "true";
    };
    zone.ondragleave = () => (zone.dataset.over = "false");
    zone.ondrop = e => {
      e.preventDefault();
      zone.dataset.over = "false";
      const value = e.dataTransfer.getData("text/plain");
      if (value) send({op: "add", coords: {[dim]: [value]}});
    };

    for (const {value} of kept) {
      if (asking && asking.dim === dim && asking.value === value) {
        zone.append(confirmChip(dim, value));
        continue;
      }
      const chip = document.createElement("button");
      chip.className = "chip";
      chip.textContent = value;
      chip.disabled = !live;
      chip.title = live ? `drop ${dim}=${value}` : "";
      chip.onclick = e => {
        e.stopPropagation();
        asking = {dim, value};
        renderDims(lastRun);
      };
      zone.append(chip);
    }
    row.append(zone);

    if (gone.length) {
      const away = document.createElement("div");
      away.className = "zone";
      const hint = document.createElement("span");
      hint.className = "hint";
      hint.textContent = "dropped:";
      away.append(hint);
      for (const {value} of gone) {
        const chip = document.createElement("button");
        chip.className = "chip gone";
        chip.textContent = value;
        chip.disabled = !live;
        chip.draggable = live;
        chip.title = live ? `drag up or double-click to restore ${dim}=${value}` : "";
        chip.ondragstart = e => e.dataTransfer.setData("text/plain", value);
        chip.ondblclick = () => send({op: "add", coords: {[dim]: [value]}});
        away.append(chip);
      }
      row.append(away);
    }
    dims.append(row);
  }
};

// -- everything else ------------------------------------------------------

const select = id => {
  if (pane !== "detail") show("detail");
  if (id === current) return;
  current = id;
  since = 0;
  lines = [];
  asking = null;
  document.getElementById("log").textContent = "";
  say("");
  refresh();
};

let lastRuns = [];

let navShows = "";

const renderNav = runs => {
  const nav = document.getElementById("runs");

  // rebuilt only when it would look different: this runs every second, and
  // replacing the list under someone scrolling it makes it unusable
  const signature = JSON.stringify([
    pane,
    current,
    runs.map(r => [r.id, r.name, r.state, r.completed, r.total,
                   r.paused, r.in_flight > 0, r.mood]),
  ]);
  if (signature === navShows) return;
  navShows = signature;

  const previous = nav.querySelector(".list");
  const scroll = previous ? previous.scrollTop : 0;
  nav.innerHTML = "";

  // at the top, where the run it makes will appear a moment later
  const fresh = document.createElement("button");
  fresh.className = "new";
  fresh.setAttribute("aria-current", pane === "launch");
  // the small triangle rather than U+25B6, which many systems draw as an
  // emoji and would sit oddly in a page of plain text
  fresh.textContent = "▸ New run";
  fresh.onclick = () => show("launch");
  nav.append(fresh);

  const list = document.createElement("div");
  list.className = "list";
  nav.append(list);

  for (const run of runs) {
    const button = document.createElement("button");
    button.setAttribute("aria-current", pane === "detail" && run.id === current);
    const title = document.createElement("span");
    title.textContent = run.name || run.id;

    const sub = document.createElement("small");
    const before = document.createElement("span");
    before.className = "dimmed";
    before.textContent = run.name ? run.id + " · " : "";
    const state = document.createElement("span");
    // the same distinction the run itself makes: asked to pause, or stopped
    const shown = run.paused
      ? run.in_flight > 0
        ? "pausing"
        : "paused"
      : run.state;
    // in a list, colour picks out what is still happening: green for a run
    // going, yellow for one on its way to a stop. A run at rest is a fact
    // about the past and stays quiet
    state.className =
      shown === "running" || shown === "pausing" ? `state ${shown}` : "state";
    state.textContent = shown;
    const after = document.createElement("span");
    after.className = "dimmed";
    after.textContent = ` · ${run.completed}/${run.total}`;

    sub.append(before, state, after);
    button.append(title, sub);
    button.onclick = () => select(run.id);
    list.append(button);
  }

  const manage = document.createElement("button");
  manage.className = "manage";
  manage.setAttribute("aria-current", pane === "manage");
  manage.textContent = "Manage runs";
  manage.onclick = () => show("manage");
  nav.append(manage);

  // a rebuild that had to happen still keeps the reader where they were
  list.scrollTop = scroll;
};

const renderRuns = runs => {
  lastRuns = runs;
  renderNav(runs);
  if (!current && runs.length) select(runs[0].id);
};

const renderRun = run => {
  lastRun = run;
  live = run.live;
  if (!editing) {
    name.value = run.name || "";
    name.dataset.saved = run.name || "";
    name.placeholder = run.id;
  }
  document.getElementById("rid").textContent = run.id;

  const state = document.getElementById("rstate");
  // a pause asked for is not a pause arrived at: what was running goes on
  // until it is done, and the two are worth telling apart
  const settling = run.paused && run.in_flight > 0;
  state.textContent =
    (run.paused ? (settling ? "pausing" : "paused") : run.state) +
    (run.replay_of ? ` · replay of ${run.replay_of}` : "");
  state.dataset.mood = run.mood;

  // the message that announced the pause described what was about to happen,
  // so once it has, it is replaced rather than left standing
  if (awaiting === "pause" && run.paused && !settling) {
    awaiting = null;
    say("paused: nothing is running now");
  }
  if (awaiting === "pause" && !run.paused) awaiting = null;

  document.getElementById("rwhen").textContent = spell(run);

  const percent = run.total ? Math.floor((100 * run.completed) / run.total) : 0;
  document.getElementById("rcount").textContent =
    `[${run.completed}/${run.total}] ${percent}%`;
  const bar = document.getElementById("rbar");
  bar.dataset.mood = run.mood;
  const fill = bar.firstElementChild;
  if (bar.dataset.run === run.id) {
    // the same run moving along: worth animating, because it is progress
    fill.style.width = `${percent}%`;
  } else {
    // a different run entirely: sliding from one run's figure to another's
    // animates something that never happened
    bar.dataset.run = run.id;
    fill.style.transition = "none";
    fill.style.width = `${percent}%`;
    fill.offsetHeight; // let the jump take effect before motion is allowed again
    fill.style.transition = "";
  }
  // where it has got to is only true of a run that is still going: the last
  // point it started is not where a finished run is
  document.getElementById("rwhere").textContent =
    run.live && run.current
      ? `currently at (${coords(run.order, run.current)})`
      : "";

  const file = document.getElementById("rfile");
  file.textContent = run.output || "";
  file.onclick = () => copyPath(file, run.output);

  renderCommand(run);
  renderSetupTrouble(run);

  const trash = document.getElementById("rdelete");
  if (run.live) {
    trash.innerHTML = "";
  } else if (trash.dataset.run !== run.id) {
    trash.dataset.run = run.id;
    confirmer(trash, "Delete run", `delete the record of ${run.id}?`, async () => {
      const answer = await ask(`/api/runs/${run.id}`, {}, "DELETE");
      if (answer.error) return say(answer.error, true);
      say(`${run.id} deleted — its results file is untouched`);
      current = null;
      trash.dataset.run = "";
      refresh();
    });
  }

  // only the steering controls need a live run: the launcher and the gap
  // actions decide for themselves, and this runs every second. What each one
  // needs beyond that differs: there is nothing to pause once a run is paused
  // and nothing to kill once nothing is running
  document.querySelectorAll("button.act[data-op]").forEach(button => {
    const op = button.dataset.op;
    const useful =
      op === "resume"
        ? run.paused
        : op === "pause"
        ? !run.paused
        : op === "kill"
        ? run.in_flight > 0
        : true;
    button.disabled = !live || !useful;
  });
  renderDims(run);
  renderGaps(run);
};

// Deleting is asked about where it is offered, in the same words the button
// used: no dialog, and nothing goes until the second click.
const confirmer = (holder, label, question, act) => {
  const render = () => {
    holder.innerHTML = "";
    const button = document.createElement("button");
    button.className = "act danger";
    button.textContent = label;
    button.onclick = () => {
      holder.innerHTML = "";
      const box = document.createElement("span");
      box.className = "confirm danger";
      box.append(question);
      const yes = document.createElement("button");
      yes.className = "yes";
      yes.textContent = "delete";
      yes.onclick = async () => {
        box.querySelectorAll("button").forEach(b => (b.disabled = true));
        await act();
        render();
      };
      const no = document.createElement("button");
      no.className = "no";
      no.textContent = "keep";
      no.onclick = render;
      box.append(yes, no);
      holder.append(box);
    };
    holder.append(button);
  };
  render();
};

// the command as the shell is running it, since a substituted one is not the
// one written in the configuration. A long one is cut to a line, with the rest
// a click away rather than pushing the page around
const FITS = 110;
let unfolded = false;

const renderCommand = run => {
  const box = document.getElementById("rcommand");
  const command = run.live ? run.command : null;
  if (!command) {
    box.innerHTML = "";
    box.dataset.of = "";
    return;
  }
  if (box.dataset.of === command && box.dataset.unfolded === String(unfolded)) return;
  box.dataset.of = command;
  box.dataset.unfolded = String(unfolded);

  box.innerHTML = "";
  const what = document.createElement("code");
  what.className = unfolded || command.length <= FITS ? "what" : "what short";
  what.textContent = command;
  box.append(what);

  if (command.length > FITS) {
    const more = document.createElement("button");
    more.textContent = unfolded ? "less" : "more";
    more.onclick = () => {
      unfolded = !unfolded;
      renderCommand(run);
    };
    box.append(more);
  }
};

// a setup that failed is worth pointing at: the trials after it were probably
// never going to work, and the reason is in a file of its own
const renderSetupTrouble = run => {
  const box = document.getElementById("rsetup");
  const trouble = run.setup_failures || [];
  const signature = JSON.stringify(trouble);
  if (box.dataset.of === signature) return;
  box.dataset.of = signature;

  box.innerHTML = "";
  if (!trouble.length) return;
  const said = document.createElement("div");
  said.textContent =
    `${trouble.length} setup command(s) failed — what each printed is here:`;
  const list = document.createElement("pre");
  list.style.color = "var(--warn)";
  list.style.maxHeight = "20vh";
  list.textContent = trouble.map(t => `${t.label}   ${t.log}`).join("\n");
  box.append(said, list);
};

// a browser will not follow a file:// link out of an http:// page, so the path
// is offered to be taken rather than opened: copied, it pastes straight into
// `yuclid plot` or an editor
const copyPath = async (element, path) => {
  if (!path) return;
  const was = element.textContent;
  try {
    await navigator.clipboard.writeText(path);
    element.textContent = was + "   copied";
    setTimeout(() => (element.textContent = was), 1200);
  } catch (e) {
    // no clipboard to write to: select it so it can be taken by hand
    const range = document.createRange();
    range.selectNodeContents(element);
    getSelection().removeAllRanges();
    getSelection().addRange(range);
  }
};

// the id is a compact stamp and reads as one; when a run happened is easier to
// take in spelled out, so the header says it both ways
// the same shape yuclid prints when a run ends, so the clock the page keeps
// and the line the terminal prints do not disagree about what 3m07s looks like
const duration = seconds => {
  seconds = Math.max(0, Math.round(seconds));
  const pad = n => String(n).padStart(2, "0");
  if (seconds < 60) return `${seconds}s`;
  const minutes = Math.floor(seconds / 60);
  if (minutes < 60) return `${minutes}m${pad(seconds % 60)}s`;
  return `${Math.floor(minutes / 60)}h${pad(minutes % 60)}m${pad(seconds % 60)}s`;
};

const spell = run => {
  if (!run.created) return "";
  const long = new Date(run.created * 1000).toLocaleString(undefined, {
    dateStyle: "long",
    timeStyle: "medium",
  });
  // a run still going has no end to measure to, so it is measured to now —
  // redrawn every second along with everything else
  if (run.live) {
    return `started ${long} · running for ${duration(Date.now() / 1000 - run.created)}`;
  }
  if (!run.ended) return `started ${long}`;
  return `started ${long} · took ${duration(run.ended - run.created)}`;
};

let gapsShow = "";

const renderGaps = run => {
  const gaps = run.gaps || [];
  document.getElementById("gaps-section").hidden = gaps.length === 0;
  if (!gaps.length) return;

  const box = document.getElementById("gaps");

  // as with the run list: redrawn only when it would differ, and the reader
  // keeps their place when it does
  const signature = JSON.stringify([run.id, run.order, run.completed, gaps]);
  if (signature === gapsShow) return renderGapActions(run, gaps.length);
  gapsShow = signature;

  const previous = box.querySelector("pre");
  const scroll = previous ? previous.scrollTop : 0;
  box.innerHTML = "";
  const counts = {};
  for (const gap of gaps) counts[gap.status] = (counts[gap.status] || 0) + 1;
  const summary = document.createElement("div");
  summary.style.marginBottom = "8px";
  summary.textContent =
    `${gaps.length} of ${gaps.length + run.completed} point(s): ` +
    Object.entries(counts).map(([s, n]) => `${n} ${s}`).join(", ");
  box.append(summary);

  // every one of them: a gap you cannot see is one you cannot act on, and the
  // list scrolls rather than being cut short
  const list = document.createElement("pre");
  list.style.maxHeight = "30vh";
  list.textContent = gaps
    .map(g => `${coords(run.order, g.key)}   ${g.status}`)
    .join("\n");
  box.append(list);
  list.scrollTop = scroll;

  renderGapActions(run, gaps.length);
};

// starting a run from an old one means one of two different things, and which
// one is not something to guess: asked before anything is spawned
const renderGapActions = (run, missing) => {
  const row = document.getElementById("gaps-actions");
  const how = document.getElementById("gaps-how");
  // the page redraws every second, which must not snatch away a question the
  // user is in the middle of answering
  if (choosing) return;
  row.innerHTML = "";
  if (run.live) {
    how.textContent = "a run can only be continued once it has ended";
    return;
  }

  const start = document.createElement("button");
  start.className = "act";
  start.textContent = "Run the missing points";
  start.onclick = () => {
    choosing = true;
    row.innerHTML = "";
    const question = document.createElement("span");
    question.className = "confirm";
    question.append(`${missing} point(s) missing:`);
    for (const [mode, label, told] of [
      ["finish", "complete this run", `same as \`yuclid finish ${run.id}\``],
      ["restart", "start a new one", `same as \`yuclid replay ${run.id} --no-steering\``],
    ]) {
      const choice = document.createElement("button");
      choice.className = "yes";
      choice.textContent = label;
      choice.onclick = () => spawn(mode, told);
      question.append(choice);
    }
    const no = document.createElement("button");
    no.className = "no";
    no.textContent = "cancel";
    no.onclick = () => { choosing = false; renderGapActions(run, missing); };
    question.append(no);
    row.append(question);
    how.textContent = "";
  };
  row.append(start);
  how.textContent = `${missing} point(s) of the space were never measured`;

  const spawn = async (mode, told) => {
    row.querySelectorAll("button").forEach(b => (b.disabled = true));
    how.textContent = "starting…";
    const answer = await ask(`/api/runs/${current}/finish`, {mode});
    choosing = false;
    renderGapActions(run, missing);
    if (answer.error) {
      how.textContent = answer.error;
      return;
    }
    how.textContent =
      mode === "finish"
        ? `run ${answer.started} is measuring the ${missing} missing point(s)`
        : `run ${answer.started} is running the whole space again`;
    if (mode === "restart") select(answer.started);
    refresh();
  };
};

// the same stamp yuclid's own diagnostics carry, so a line from the page and
// a line from the terminal can be lined up
const stamp = seconds => {
  const d = new Date(seconds * 1000);
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ` +
    `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
};

const summarize = record => {
  const at = stamp(record.time);
  if (record.type === "point.started") return `${at}  ${record.key.join(".")} started`;
  if (record.type === "point.finished")
    return `${at}  ${(record.key || []).join(".")} ${record.failed ? "FAILED" : "completed"} ${
      record.metrics ? Object.entries(record.metrics).map(([k, v]) => `${k}=${v}`).join(" ") : ""}`;
  if (record.type === "point.killed")
    return `${at}  ${record.key.join(".")} ${record.scope} abandoned`;
  if (record.type === "op.applied") return `${at}  control: ${JSON.stringify(record.op)}`;
  if (record.type === "plan") return `${at}  plan: ${record.points.length} point(s)`;
  if (record.type === "run.finished") return `${at}  run ${record.state}`;
  return `${at}  ${record.type}`;
};

const renderProgress = payload => {
  if (!payload.records.length) return;
  since = payload.seq;
  lines.push(...payload.records.map(summarize));
  lines = lines.slice(-300);
  const log = document.getElementById("log");
  const stuck = log.scrollTop + log.clientHeight >= log.scrollHeight - 20;
  log.textContent = lines.join("\n");
  if (stuck) log.scrollTop = log.scrollHeight;
};

const refresh = async () => {
  try {
    const {runs} = await ask("/api/runs");
    renderRuns(runs);
    if (!current || pane !== "detail") return;
    renderRun(await ask(`/api/runs/${current}`));
    renderProgress(await ask(`/api/runs/${current}/progress?since=${since}`));
  } catch (e) {
    say(String(e), true);
  }
};

refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
